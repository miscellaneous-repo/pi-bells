name: Bug report
description: The bell does not ring, rings twice, or rings when it should not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, please check two things — they explain most reports:

        1. **Terminal sound** is configured in the terminal, not here: Windows Terminal needs
           `bellStyle` to include `audible`, and `bellSound` on the profile you are actually using.
        2. **The log** says why a bell was skipped:
           `Get-Content "$env:TEMP\pi-bells.log" -Tail 20`

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected vs. actual, and what you were doing when it happened.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log tail
      description: Last ~20 lines of the log file (`PI_BELL_LOG` if you moved it).
      render: text
    validations:
      required: true

  - type: input
    id: pi-version
    attributes:
      label: pi version
      description: Output of `pi --version`.
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      placeholder: Windows Terminal 1.22 on Windows 11
    validations:
      required: true

  - type: input
    id: installed
    attributes:
      label: How did you install it?
      placeholder: pi install npm:pi-bells / copied pi-bells.ts into ~/.pi/extensions
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment variables in effect
      description: Any `PI_BELL_*` variable you set.
      render: text
    validations:
      required: false
