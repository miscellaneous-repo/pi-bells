# Release pipeline — prepared, but inert until an npm token exists.
#
# Turning it on:
#   1. Repository secret `NPM_TOKEN` = an npm automation token with publish rights on `pi-bells`.
#   2. `npm version minor && git push --follow-tags`
# Until the secret is set, the publish step prints a notice and is skipped; the CI job still
# validates lint, types and tests, and the GitHub release is still created.
#
# Provenance (`--provenance`) is published from GitHub Actions via OIDC — no extra setup needed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Lint, typecheck and test
        run: npm run check

      - name: Tag must match package.json
        run: |
          version=$(node --input-type=commonjs -e "process.stdout.write(require('./package.json').version)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public

      - name: Publish skipped (no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN is not configured — skipping npm publish. See the header of this workflow."

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
